准的","options":[],"answer":"C","explain":""},{"stem":"对轻微失信主体实施信用管理措施的期限为2年。（）","options":[],"answer":"×","explain":""}]},{"k":"信用管理期限与修复","v":"管理期限：对严重失信主体实施信用管理措施的期限为3年，对轻微失信主体实施信用管理措施的期限为1年。【蕾蕾大招：严3轻1】修复程序：（1）申请：向认定部门提出信用修复申请，提交信用修复申请书、培训记录、纠正失信行为等材料。（2）受理：认定部门收到申请后，应当于10个工作日内予以受理。（3）核查：认定部门应当自受理之日起10个工作日内检查核实。（4）决定：认定部门应当自核查完成之日起5个工作日内作出准予或不予修复的决定。（5）修复：认定部门应当自作出准予修复决定之日起5个工作日内，解除对失信主体的相关管理措施。【蕾蕾大招：神力察觉修复十十五五】不予信用修复的情形：（1）认定为严重失信主体不满6个月的、认定为轻微失信主体不满3个月的；（2）因违反相关法律法规规定，依法被限制或者禁止行业准入期限尚未届满的；（3）距离上一次信用修复时间不到1年的；（4）申请信用修复过程中存在弄虚作假、故意隐瞒事实等欺诈行为的；（5）申请信用修复过程中又因同一原因受到行政处罚，造成不良社会影响的；（6）法律法规和党中央、国务院政策文件明确规定不可修复的。【蕾蕾大招：重6轻3不能修】","matchCount":6,"sampleQuestions":[{"stem":"文化市场主体存在“捂票炒票”行为，造成不良社会影响，应被认定为（ ）。","options":[{"label":"A","text":"严重失信主体"},{"label":"B","text":"轻微失信主体"},{"label":"C","text":"不认定为失信主体"},{"label":"D","text":"先进行警告，若再犯认定为失信主体"}],"answer":"B","explain":"《文化和旅游市场信用管理规定》第十五条规定，文化和旅游市 场主体和从业人员有下列情形之一的，应当认定为轻微失信主体：（1）存在“捂票炒票”、 虚假宣传、未履行相关义务、违反公序良俗等行为，造成不良社会影响的；（2）因故意或 者重大过失严重损害旅游者合法权益，但尚不符合严重失信主体认定情形的；（3）在旅游 经营活动中存在安全隐患，未在指定期限内整改完毕的；（4）拒不配合投诉处置、执法检 查，拒不履行"},{"stem":"当事人在收到《严重失信主体认定告知书》后，有权在多少个工作日内提交书面陈述、申辩及相关证明材料（ ）。","options":[{"label":"A","text":"5个工作日"},{"label":"B","text":"10个工作日"},{"label":"C","text":"15个工作日"},{"label":"D","text":"20个工作日"}],"answer":"B","explain":"《文化和旅游市场信用管理规定》第十四条规定，当事人在被告 知的10个工作日内有权向认定部门提交书面陈述、申辩及相关证明材料，逾期不提交的， 视为放弃。认定部门应当在15个工作日内给予答复。陈述、申辩理由被采纳的，不认定为 严重失信主体。"}]}]},{"name":"演出安全标准与应急","priority":2,"items":[{"k":"第一类危险源","v":"可能发生意外释放能量或危险物的危险源。示例：火灾、触电、滑倒、坠落、爆炸等。【蕾蕾大招：点火追花豹危险】","matchCount":7,"sampleQuestions":[{"stem":"安全隐患类别与防范第一类危险源不包括（A.防火B.防电C.防坠D.防风","options":[],"answer":"D","explain":""},{"stem":"第一类危险源是导致能量或危险物约束或限制措施破坏或失效的各种因素。（ ）","options":[],"answer":"×","explain":"第一类危险源是可能发生意外释放能量或危险物的危险源，第 二类危险源是导致能量或危险物约束或限制措施破坏或失效的各种因素，所以该说法错误。"}]},{"k":"第二类危险源","v":"导致能量或危险物约束或限制措施破坏或失效的各种因素。示例：安全制度、安检措施、安防措施、安保措施、应急预案等","matchCount":7,"sampleQuestions":[{"stem":"下列属于第二类危险源的有（ ）。","options":[{"label":"A","text":"演出功能缺陷"},{"label": 的必要内容。【蕾蕾大招：午安】演出团体每次演出应有不少于一次的安全警示和安全教育，应符合演出场所的安全管理规范","matchCount":4,"sampleQuestions":[{"stem":"剧场舞台专业设备在投入使用前应由（）检验合格。A.工程监理机构B.舞台专业设备监理机构C.专业检测机构D.剧场工艺设计专业机构","options":[],"answer":"C","explain":""},{"stem":"下列对演出场所经营单位说法正确的有（ ）。","options":[{"label":"A","text":"明确的舞台系统设备保养、维护和维修制度"},{"label":"B","text":"3年及3年以上大型维修工程的第三方安全认证"},{"label":"C","text":"对舞台机械5年以上进行安全检测和必要的安全检修"},{"label":"D","text":"对10年以上的舞台幕布检测防火性能"}],"answer":"AC","explain":"演出场所经营单位应有明确的舞台系统设备保养、维护和维修 制度；5年及5年以上大型维修工程的验收，应有第三方的安全认证；舞台机械5年以上应 进行安全检测和必要的安全检修；舞台幕布防火有效期到达后应检测防火性能，5年以上的 舞台幕布应检测防火性能，所以AC都正确。"}]},{"k":"刚性防火幕","v":"设置在舞台台口处，在火灾情况下可迅速封闭台口，隔离舞台与观众厅或舞台以外的区域，防止火灾蔓延的刚性结构设备。耐火极限≥60min。【蕾蕾大招：耐火1小时，全程345】自重下降时间：紧急释放全行程30～45s，距舞台面2.5m后≥10s。操作方式：电动升降、电动紧急释放下降、手动紧急释放下降。幕体下方禁止放置任何影响其下降的物品，禁止采取任何可能阻碍幕体全行程下降、自由下降的措施。除演出、排练及其他类似情况外，幕体宜处于关闭状态（特别是非工作期间）。应定期测试电动升降、电动紧急释放和手动紧急释放的操作方式。定期维护条件：①采用紧急释放/手动释放关闭幕体达到30次；②使用6个月。每年应对刚性防火隔离幕进行一次全面检修","matchCount":11,"sampleQuestions":[{"stem":"下列关于舞台刚性防火幕说法错误的是（ ）","options":[{"label":"A","text":"隔离舞台与观众厅或舞台以外的区域"},{"label":"B","text":"舞台刚性防火幕工作时应落幕到舞台面。"},{"label":"C","text":"设置在舞台台口处，在火灾情况下可迅速封闭台口"},{"label":"D","text":"防止火灾蔓延及烟雾扩散的刚性结构设备"}],"answer":"B","explain":"舞台刚性防火幕非工作状态时应落幕到舞台面。"},{"stem":"下列关于舞台刚性防火幕说法错误的是（A.隔离舞台与观众厅或舞台以外的区域B.舞台刚性防火幕工作时应落幕到舞台面。C.设置在舞台台口处，在火灾情况下可迅速封闭台口D.防止火灾蔓延及烟雾扩散的刚性结构设备","options":[],"answer":"B","explain":""}]},{"k":"剧场规模分类","v":"按规模划分：小型剧场≤800座；中型剧场801～1200座；大型剧场1201～1500座；特大型剧场1501～2500座；超大型剧场2501座以上。【蕾蕾大招：8121525】按使用用途和舞台功能：专业剧场、综合剧场、多功能剧场（灵活变）、多用途剧场（用途固定，功能多变）。【蕾蕾大招：多多中专】","matchCount":3,"sampleQuestions":[{"stem":"关于剧场规模的分类，以下哪种说法是正确的？（）A.剧场规模在1000 座以下的为小型剧场B.剧场规模在1300-1500座之间的为中型剧场C.剧场规模在1300-1500 座之间的为大型剧场D.剧场规模超过2000座的为大型剧场","options":[],"answer":"C","explain":""},{"stem":"不属于剧场类型按经营模式划分的是（A.租赁剧场B.保留剧目剧场C.连续上演制剧场D.多功能剧场","options":[],"answer":"D","explain":""}]},{"k":"舞台类型","v":"开放式舞台（开敞式舞台）：全部表演区和观众席处于同一个空间内的舞台形式。中心舞台（岛式舞台）：表演区设在观众席中间，观众席四面环绕。中间舞台（横向舞台）：表演区设在观众席之间，观众席相向位于表演区两侧。尽端式舞台：表演区设于开放式剧场一端、观众席与之相对的舞台形式。伸出式舞台：表演区伸出至观众厅内，观众席围绕主要表演区。环形舞台：表演区设在观众席四周。镜框式舞台：在观众厅和舞台之间以镜框式的台口为分隔的舞台形式","matchCount":10,"sampleQuestions":[{"stem":"演出经纪人员资格证遗失的，应当通过全国文化市场技术监管与服务平台提交遗失声明，遗失声明公示满30日方可申请补发资格证，遗失声明应当载明的不包括（ ）等。","options":[{"label":"A","text":"证件类型"},{"label":"B","text":"演出经纪人员电话"},{"label":"C","text":"演出经纪人员姓名"},{"label":"D","text":"证件编号"}],"answer":"B","explain":"《演出经纪人员资格证管理规定（试行）》第九条规定，演出经 纪人员资格证遗失的，应当通过全国文化市场技术监管与服务平台提交遗失声明，遗失声 明公示满30日方可申请补发资格证。遗失声明应当载明证件类型、演出经纪人员姓名、证 件编号等。"},{"stem":"以下属于演出剧（节）目的是（ ）。","options":[{"label":"A","text":"新闻播报"},{"label":"B","text":"体育赛事直播"},{"label":"C","text":"脱口秀演出活动"},{"label":"D","text":"电商直播带货"}],"answer":"C","explain":"演出剧（节）目包括但不限于音乐会、演唱会、音乐节、舞台 戏剧（含戏曲、话剧、歌剧、舞剧、音乐剧等）、曲艺、杂技、脱口秀等演出活动，A、B、 D选项不属于此类。"}]},{"k":"剧场工艺安全","v":"一般要求：剧场工艺安全应从安全隐患与风险识别的角度，对剧场设计、建设、验收等过程进行安全防范。安全隐患与风险识别：（1）第一类危险源：可能发生意外释放能量或危险物的危险源，如火灾、漏电、漏水、跌落、倒塌、挤压、突发事件。（2）第二类危险源：导致能量或危险物约束或限制措施破坏或失效的各种因素，如演出功能缺陷、系统安全隐患、安全管理缺位、安全意识薄弱、应急预案缺失或无效。安全防范：（1）规划设计→剧场建设项目可行性研究、建设规划、建筑设计阶段，应有剧场工艺设计专业机构或人员参与。（2）设计审查→剧场建筑工程设计完成后，应进行剧场工艺安全性审查；剧场舞台专业设备进场安装前，应对施工图纸、设计说明等文件进行标准符合性和设备安全性专项审查。（3）过程监检→剧场建筑工程施工，应由工程监理机构实施法定监检；剧场舞台专业设备施工阶段，应由舞台专业设备监理机构实施过程监检。（4）检测验收→剧场建筑工程验收、竣工，应按照国家相关规定执行；剧场舞台专业设备在投入使用前应由专业检测机构检验合格","matchCount":20,"sampleQuestions":[{"stem":"剧场建设项目可行性研究、建设规划、建筑设计阶段，应有（ ）参与。","options":[{"label":"A","text":"剧场工艺设计专业机构或人员"},{"label":"B","text":"消防机构人员"},{"label":"C","text":"环保机构人员"},{"label":"D","text":"公安机构人员"}],"answer":"A","explain":"剧场建设项目可行性研究、建设规划、建筑设计阶段，应有剧场 工艺设计专业机构或人员参与。可知选A。"},{"stem":"消防救援机构对取得许可的公众聚集场所进行现场核查的时间是（ ）。","options":[{"label":"A","text":"自作出许可之日起10个工作日内"},{"label":"B","text":"自作出许可之日起20个工作日内"},{"label":"C","text":"自作出许可之日起30个工作日内"},{"label":"D","text":"自收到申请之日起20个工作日内"}],"answer":"B","explain":"消防救援机构对取得许可的公众聚集场所应当自作出许可之日 起20个工作日内，按照《公众聚集场所投入使用、营业消防安全检查规则》进行核查，现 场核查应当通知场所法定代表人或者主要负责人到场。"}]},{"k":"消防检查（告知承诺制）","v":"公众聚集场所投入使用、营业前消防安全检查，申请人可自主选择采用告知承诺制方式办理，或者选择不采用告知承诺方式办理。【蕾蕾大招：告知伸手可查】告知承诺管理流程：（1）申请→提交《公众聚集场所投入使用、营业消防安全告知承诺书》、营业执照、场所平面布置图、场所消防设施平面图、消防安全制度、灭火和应急疏散预案等材料。（2）受理及许可→材料齐全、符合法定形式的，予以许可；对到消防业务受理窗口提出申请的，应当当场作出决定；对通过消防在线政务服务平台提出申请的，应当自收到申请之日起一个工作日内办结。（3）现场核查→消防救援机构对取得许可的公众聚集场所应当自作出许可之日起20个工作日内进行核查。核查发现与承诺内容不符的，应当依法予以处罚，符合临时查封条件的，应当依法予以临时查封，同时自核查之日起3个工作日内制作送达《责令限期改正通知书》。消防救援机构应当在责令限期改正期满或者收到当事人的复查申请之日起3个工作日内进行复查。对逾期不整改或者整改后仍达不到要求的，依法撤销许可。【蕾蕾大招：告知2033】不采用告知承诺方式：消防救援机构应当自受理申请之日起10个工作日内进行检查，自检查之日起3个工作日内作出决定。【蕾蕾大招：不告知103】","matchCount":6,"sampleQuestions":[{"stem":"消防救援机构对取得许可的公众聚集场所进行现场核查的时间是（ ）。","options":[{"label":"A","text":"自作出许可之日起10个工作日内"},{"label":"B","text":"自作出许可之日起20个工作日内"},{"label":"C","text":"自作出许可之日起30个工作日内"},{"label":"D","text":"自收到申请之日起20个工作日内"}],"answer":"B","explain":"消防救援机构对取得许可的公众聚集场所应当自作出许可之日 起20个工作日内，按照《公众聚集场所投入使用、营业消防安全检查规则》进行核查，现 场核查应当通知场所法定代表人或者主要负责人到场。"},{"stem":"对安全生产信用记录存在问题的文化市场经营单位，应（ ）。","options":[{"label":"A","text":"列为重点监督检查对象，减少检查频次"},{"label":"B","text":"列为重点监督检查对象，增加检查频次"},{"label":"C","text":"取消其经营资格"},{"label":"D","text":"罚款并责令整改"}],"answer":"B","explain":"“对安全生产信用记录存在问题的，列为重点监督检查对象，增 加检查频次，加大监督检查力度，督促其依法整改，及时消除安全生产隐患”，所以选B。"}]},{"k":"临时搭建舞台、看台安全","v":"排距要求：①短排法→硬椅间距≥0.8m，软椅间距≥0.9m，台阶式地面排距应适当增大，椅背到后面一排最突出部分的水平距离≥0.3m。大型活动座椅间距均应大于1.2m。②长排法→硬椅≥1m，软椅≥1.1m。台阶式地面排距应适当增大，椅背到后面一排最突出部分水平距离≥0.5m。③靠后墙座椅→最后一排座椅排距应至少增大0.12m。排列要求：①短排法→双侧有走道时不应超过26座，单侧有走道时不应超过13座；超过限额时，每增加一座位，排距增大25mm。②长排法→双侧有走道时不应超过50座，单侧有走道时不应超过25座。【蕾蕾大招：短26长50】","matchCount":20,"sampleQuestions":[{"stem":"临时搭建舞台看台安全管理策划方案应包括举办场地曾经发生事故的应对方案。（）","options":[],"answer":"√","explain":"（联网搜索+法规确认）"},{"stem":"临时搭建看台当看台与地面高差不小于（ ）时，应设置防护栏。","options":[{"label":"A","text":"0.6m"},{"label":"B","text":"0.8m"},{"label":"C","text":"1.0m"},{"label":"D","text":"1.2m"}],"answer":"A","explain":"“当看台与地面高差不小于0.6m时，应设置防护栏”，所以选A。"}]},{"k":"临时搭建监检与验收","v":"临时搭建舞台/看台：为短期演出搭建，演出结束即拆除。短期使用（通过验收至使用结束≤30天），超期需再次验收。【蕾蕾大招：琳达30】实施组织：各类演出活动的临时搭建舞台、看台应组织过程监检。其中：观众人数在10000人（含）以上或演职人员在500人（含）以上的演出活动场所临时搭建舞台、看台应组织过程监检并进行验收检验。【蕾蕾大招：观望五百中后检】工作委托：演出组织单位或演出承办（经纪）机构应在临时搭建施工单位进场前不少于10个工作日确认（委托）过程监检和验收检验机构。监检和检验机构要求：过程监检机构应具有法人资格，设备监理服务能力范围应覆盖临时搭建演出场所舞台设备。验收检验机构应具有法人资格，检验服务能力范围应覆盖舞台设备，并具 中应包括但不限于演出举办单位名称、 演出名称、演出日期等内容）。"},{"stem":"演出举办单位通过全国文化市场技术监管与服务平台提交跨地区巡演申请后，由（ ）文化和旅游行政部门在规定审批时限内作出决定。","options":[{"label":"A","text":"首演地"},{"label":"B","text":"巡演地"},{"label":"C","text":"举办单位所在地"},{"label":"D","text":"任意一地"}],"answer":"A","explain":"演出举办单位应当通过全国文化市场技术监管与服务平台提交 跨地区巡演申请，由平台将相关信息同步推送给相应文化和旅游行政部门。首演地文化和 旅游行政部门应当在规定审批时限内作出决定。所以答案是A项。"}]},{"k":"巡演审批流程","v":"办理渠道：演出举办单位应当通过全国文化市场技术监管与服务平台提交跨地区巡演申请，由平台将相关信息同步推送给相应文化和旅游行政部门。首演地审批：首演地文化和旅游行政部门应当在规定审批时限内作出决定。同意的，出具批准文件，由平台将相关审批结果推送给巡演地相应文化和旅游行政部门，巡演地文化和旅游行政部门不再重复进行内容审核。巡演地材料提交与审核：演出举办单位应在巡演地举办演出活动前，向巡演地文化和旅游行政部门提供场地、安全、消防等证明材料，文化和旅游行政部门在3个工作日内完成审核。增加演出地办理流程：需要增加演出地的，演出举办单位应当通过全国文化市场技术监管与服务平台提交增加演出地备案申请，演出增加地文化和旅游行政部门应当自受理之日起3个工作日内完成审核","matchCount":4,"sampleQuestions":[{"stem":"演出举办单位通过全国文化市场技术监管与服务平台提交跨地区巡演申请后，由（ ）文化和旅游行政部门在规定审批时限内作出决定。","options":[{"label":"A","text":"首演地"},{"label":"B","text":"巡演地"},{"label":"C","text":"举办单位所在地"},{"label":"D","text":"任意一地"}],"answer":"A","explain":"演出举办单位应当通过全国文化市场技术监管与服务平台提交 跨地区巡演申请，由平台将相关信息同步推送给相应文化和旅游行政部门。首演地文化和 旅游行政部门应当在规定审批时限内作出决定。所以答案是A项。"},{"stem":"跨地区巡演演出活动经文化和旅游行政部门批准后，增加演出地备案申请，文化和旅游行政部门完成审核的时间是（ ）。","options":[{"label":"A","text":"自受理之日起3个工作日内"},{"label":"B","text":"自受理之日起5个工作日内"},{"label":"C","text":"自受理之日起7个工作日内"},{"label":"D","text":"自受理之日起10个工作日内"}],"answer":"A","explain":"演出活动经文化和旅游行政部门批准后，需要增加演出地的， 演出举办单位应当通过全国文化市场技术监管与服务平台提交增加演出地备案申请，演出 增加地文化和旅游行政部门应当自受理之日起3个工作日内完成审核，通过的，出具备案 证明并及时公示。"}]},{"k":"演出市场营销","v":"从演出经营者的立场出发，以观众为对象，以观众需求为中心，前提与核心是以观众需求为中心","matchCount":108,"sampleQuestions":[{"stem":"演出市场营销是从（ ）的立场出发。","options":[{"label":"A","text":"大众群体"},{"label":"B","text":"市场需求"},{"label":"C","text":"演出经营者"},{"label":"D","text":"演出表演者"}],"answer":"C","explain":"演出市场营销的基本概念演出市场营销是从演出经营者的立场出 发，以观众为对象，研究演出经营者如何面对市场、面向观众，以观众需求为中心，通过 现代市场运作方式把演出产品这一特殊的艺术品呈现给观众或企业客户，在满足观众或企 业客户需求的同时，使演出经营者获得最大利润的全过程。"},{"stem":"明确（）的市场定位，是演出市场营销的前提，对演出制作、宣传营销等诸环节有重要影响。A.演出项目B.演出产品C.演出营销D.演出策划","options":[],"answer":"B","explain":""}]},{"k":"演出风险管理","v":"运用风险系数进行演出项目可行性分析：30%低风险；50%中等风险；70%高风险（需寻求投资赞助）。【蕾蕾大招：低中高357】","matchCount":95,"sampleQuestions":[{"stem":"申请举办营业性组台演出，应提交的材料不包括（ ）。","options":[{"label":"A","text":"演出名称、演出举办单位和参加演出的文艺表演团体、演员"},{"label":"B","text":"演出时间、地点、场次"},{"label":"C","text":"3名以上专职演出经纪人员和与其业务相适应的资金"},{"label":"D","text":"文艺表演团体、演员同意参加演出的书面函件"}],"answer":"C","explain":"《营业性演出管理条例》第十六条规定，申请举办营业性演出， 提交的申请材料应当包括下列内容：（一）演出名称、演出举办单位和参加演出的文艺表演 团体、演员；（二）演出时间、地点、场次；（三）节目及其视听资料。申请举办营业性组 台演出，还应当提交文艺表演团体、演员同意参加演出的书面函件。提示：注意区分营业 性组台演出和营业性演出"},{"stem":"大型演出活动审批前，应当经过哪些部门的风险评估和综合研判？（ ）","options":[{"label":"A","text":"工商行政管理部门"},{"label":"B","text":"省级公安机关"},{"label":"C","text":"省级文化和旅游行政部门、属地公安机关"},{"label":"D","text":"省级市场监督管理部门"}],"answer":"C","explain":"“大型演出活动审批前，应当经过省级文化和旅游行政部门、属 地公安机关风险评估和综合研判”。"}]},{"k":"舞台特殊效果设备","v":"（1）干冰机：使整个舞台在云雾笼罩之中。（2）二氧化碳气柱：可以在舞台上空出现烟雾缭绕的效果。（3）雪花机：可以呈现舞台上空雪花纷飞的效果。（4）泡泡机：用灯光一打出现五颜六色的气泡效果。（5）焰火：焰火与烟花是两个概念。焰火又分为冷焰火（不产生热量，不能引燃其他物品）和热焰火（能产生热量，在使用时要特别注意安全并严格按照安全消防部门的要求执行）","matchCount":5,"sampleQuestions":[{"stem":"临时搭建舞台看台施工过程中，从事特种设备吊装等作业人员应(）。A.经过简单培训上岗B.按照国家对特种设备作业相关要求持证上岗C.有相关工作经验即可D.听从现场指挥人员安排上岗","options":[],"answer":"B","explain":""},{"stem":"临时搭建舞台、看台施工企业安全管理规范包括（ ）。","options":[{"label":"A","text":"应有施工图设计和施工组织设计"},{"label":"B","text":"应对施工人员进行安全教育"},{"label":"C","text":"设置专门的安全管理岗位"},{"label":"D","text":"特殊岗位应持证上岗"}],"answer":"ABCD","explain":"“临时搭建舞台、看台施工应有施工图设计和施工组织设计， 施工图设计应包括舞台、看台安全承载计算和应力计算，施工组织设计应包括施工企业的 安全管理组织设计、岗位设计和安全管理规范。临时搭建舞台、看台施工应对施工人员进 行安全教育，并设置专门的安全管理岗位，特殊岗位应持证上岗，包括安全管理、电工（高 压、低压）、高空作业等”，ABCD选项都正确，所以全选。"}]},{"k":"文化部安全生产通知","v":"一是突出重点：加强对寒暑假、节假（庆）日等重点时期文化市场的安全生产检查；加强对城乡接合部、城中村、农村乡镇、校园周边等重点地段文化市场的安全生产检查；加强对露天音乐节、酒吧和农村庙会中营业性演出的安全生产检查。二是措施得力：按照\"四不两直\"（不发通知，不打招呼，不听汇报，不用陪同和接待，直奔基层，直插现场）的要求，采取明察暗访、随机抽查、\"回头看\"检查、交叉检查等方式。从业人员消防安全技能要达到\"一懂三会\"（懂本岗位火灾危险性、会报警、会扑救初起火灾、会组织疏散逃生）","matchCount":5,"sampleQuestions":[{"stem":"对安全生产信用记录存在问题的文化市场经营单位，应（ ）。","options":[{"label":"A","text":"列为重点监督检查对象，减少检查频次"},{"label":"B","text":"列为重点监督检查对象，增加检查频次"},{"label":"C","text":"取消其经营资格"},{"label":"D","text":"罚款并责令整改"}],"answer":"B","explain":"“对安全生产信用记录存在问题的，列为重点监督检查对象，增 加检查频次，加大监督检查力度，督促其依法整改，及时消除安全生产隐患”，所以选B。"},{"stem":"取得演出经纪人员资格证书后，如个人信息发生变更，应当自变更后（ ）内通过平台进行信息更新。","options":[{"label":"A","text":"1个月"},{"label":"B","text":"3个月"},{"label":"C","text":"5个月"},{"label":"D","text":"10个月"}],"answer":"B","explain":"《演出经纪人员管理办法》第十四条规定，文化和旅游部建立演 出经纪人员资格证管理库。通过演出经纪人员资格认定考试的人员，应当自合格分数线公 布之日起30日内通过全国文化市场技术监管与服务平台领取演出经纪人员资格证。如个人 信息发生变更，应当自变更后3个月内通过平台进行信息更新。"}]}]},{"name":"演出经纪行为与规范","priority":2,"items":[{"k":"规范演员从业行为的要求","v":"（1）演员应当自觉践行社会主义核心价值观，主动承担起举旗帜、聚民心、育新人、兴文化、展形象的使命任务，讲品位、讲格调、讲责任，不断提高思想品德修养、职业道德素养和人文艺术涵养，争做德艺双馨的文艺工作者。（2）演员经纪公司、工作室应当维护演员合法权益，承担演员管理责任，将政治素养、道德品行作为演员选用和培养的重要标准，定期组织教育培训，增强演员守法意识和道德修养。建立演员自律自查工作制度，查找演员从业行为存在的问题及风险点，督促演员及时改正。（3）演员经纪从业人员应当加强对演员的教育、提醒，积极引导演员时刻敬畏法律红线，严守道德底线，提升职业操守，积极营造崇德尚艺、见贤思齐的良好风气。（4）从事未成年人签约、推广、代理等演出经纪活动的演员经纪公司、工作室，应当按照《中华人民共和国未成年人保护法》《中华人民共和国教育法》《中华人民共和国义务教育法》《中华人民共和国劳动法》有关规定，依法保障其接受并完成规定年限的义务教育的权利。严禁以招募\"演艺练习生\"等名义，向未成年人灌输所谓\"出名要趁早\"等错误观念，误导未成年人价值观，侵害未成年人合法权益","matchCount":34,"sampleQuestions":[{"stem":"网络主播应当坚持（ ）为创作导向。","options":[{"label":"A","text":"以人民为中心"},{"label":"B","text":"以正确政治方向"},{"label":"C","text":"以维护公共利益"},{"label":"D","text":"以坚持健康网络环境"}],"answer":"A","explain":"《网络主播行为规范》第五条规定，网络主播应当坚持以人民为 中心的创作导向，传播的网络表演、视听节目内容应当反映时代新气象、讴歌人民新创造， 弘扬中华优秀传统文化，传播正能量，展现真善美，满足人民群众美好生活新需要。"},{"stem":"剧场建设项目在哪个阶段应有剧场工艺设计专业机构或人员参与？（ ）","options":[{"label":"A","text":"可行性研究、建设规划、建筑设计阶段"},{"label":"B","text":"施工阶段"},{"label":"C","text":"验收阶段"},{"label":"D","text":"运营阶段"}],"answer":"A","explain":"在安全防范的规划设计要求中，剧场建设项目可行性研究、建 设规划、建筑设计阶段，应有剧场工艺设计专业机构或人员参与，所以选A。"}]},{"k":"演员变更","v":"不可擅自变更演出内容，变更须及时告知观众，观众有权退票","matchCount":18,"sampleQuestions":[{"stem":"营业性演出需要变更申请材料所列事项时，应当（ ）。","options":[{"label":"A","text":"提交变更申请"},{"label":"B","text":"重新报批"},{"label":"C","text":"提交变更说明"},{"label":"D","text":"提交补充材料"}],"answer":"B","explain":"营业性演出需要变更申请材料所列事项的，应当依照规定重新 报批。"},{"stem":"文化市场主体因欺骗手段取得许可证，应被认定为（ ）。","options":[{"label":"A","text":"轻微失信主体"},{"label":"B","text":"严重失信主体"},{"label":"C","text":"不认定为失信主体"},{"label":"D","text":"先警告，再视情况认定"}],"answer":"B","explain":"《文化和旅游市场信用管理规定》第十二条规定，文化市场主体 和从业人员有下列情形之一的，应当将其认定为严重失信主体：（1）因欺骗、故意隐匿、 伪造、变造材料等不正当手段取得许可证、批准文件的，或者伪造、变造许可证、批准文 件的；（2）提供含有法律、行政法规、规章禁止的内容，造成严重后果的；（3）受到文化 和旅游主管部门吊销许可证行政处罚的；（4）擅自从事营业性演出、娱乐场所、互联网上 网服务等文化市"}]},{"k":"假唱","v":"演员不得以假唱欺骗观众，演出举办单位不得组织假唱","matchCount":5,"sampleQuestions":[{"stem":"假唱、假演奏是指演员在演出过程中，使用事先录制好的歌曲、乐曲代替现场演唱、演奏的行为。（ ）","options":[],"answer":"√","explain":"《营业性演出管理条例实施细则》第二十六条规定，营业性演出 不得以假唱、假演奏等手段欺骗观众。前款所称假唱、假演奏是指演员在演出过程中，使 用事先录制好的歌曲、乐曲代替现场演唱、演奏的行为。演出举办单位应当派专人对演唱、 演奏行为进行监督，并作出记录备查。记录内容包括演员、乐队、曲目的名称和演唱、演 奏过程的基本情况，并由演出举办单位负责人和监督人员签字确认。"},{"stem":"演出经纪人员不得有下列行为（ ）。","options":[{"label":"A","text":"对演出活动进行虚假宣传"},{"label":"B","text":"出租、出借演出经纪人员资格证"},{"label":"C","text":"在一家演出经纪机构从业"},{"label":"D","text":"隐瞒、伪造与演出经纪业务有关的重要事项"}],"answer":"ABD","explain":"《演出经纪人员管理办法》第十六条规定，演出经纪人员不得 有下列行为：（一）在两家以上演出经纪机构从业；（二）出租、出借演出经纪人员资格证； （三）为含有《营业性演出管理条例》第二十五条禁止内容的演出提供服务；（四）隐瞒、 伪造与演出经纪业务有关的重要事项；（五）对演出活动进行虚假宣传；（六）为演员假唱、 假演奏提供条件；（七）其他扰乱演出市场秩序的行为。"}]},{"k":"高峰时段管理","v":"（1）每日20时至22时是青少年上网的高峰时段，也是规范网络直播的重要时点。（2）网站平台在每日高峰时段，单个账号直播间\"连麦PK\"次数不得超过2次，不得设置\"PK惩罚\"环节，不得为\"PK惩罚\"提供技术实现方式，避免诱导误导未成年人。（3）网站平台应在每日22时后，对\"青少年模式\"下的各项服务强制下线，并不得提供或变相提供常规模式开启方式，保障青少年充足休息时间。【蕾蕾大招：少年2】","matchCount":4,"sampleQuestions":[{"stem":"每日高峰时段（20时至22时），单个账号直播间“连麦 $\\mathrm{PK}$”次数不得超过（A.1次B.2次C.3次D.4次","options":[],"answer":"B","explain":""},{"stem":"根据舞台安全管理相关规范，当舞台高度 $\\geq0.8m$ 时，为防止通道及演职人员发生跌落事故，需在舞台边缘设置的防护设施是（A.防滑地胶B.应急指示牌C.警示灯带D.防护栏","options":[],"answer":"D","explain":""}]},{"k":"未成年人客服","v":"网站平台应建立未成年人专属客服团队","matchCount":23,"sampleQuestions":[{"stem":"演出活动中，有未成年人参与的，应当（ ）。","options":[{"label":"A","text":"经过未成年人老师同意"},{"label":"B","text":"经过未成年人父母或者其他监护人同意"},{"label":"C","text":"不需要任何同意"},{"label":"D","text":"经过未成年人自己同意"}],"answer":"B","explain":"“有未成年人参与的演出，应当经过未成年人父母或者其他监护 人同意”，所以选B。"},{"stem":"对于违规为未成年用户提供打赏服务的网站平台，以及明知用户为未成年人仍诱导打赏的经纪机构和网络主播，应（ ）采取处置措施。","options":[{"label":"A","text":"从轻"},{"label":"B","text":"从重"},{"label":"C","text":"一般"},{"label":"D","text":"视情况"}],"answer":"B","explain":"“对于违规为未成年用户提供打赏服务的网站平台，以及明知用 户为未成年人仍诱导打赏的经纪机构和网络主播，从严采取处置措施”，所以选B。"}]}]},{"name":"相关规范文件","priority":1,"items":[{"k":"网络演出剧（节）目管理","v":"提供进口网络演出剧（节）目的，应当报文化和旅游部进行内容审查，内容审查通过后方可向用户提供；提供国产网络演出剧（节）目的，应当在向用户提供之日起30日内，报文化和旅游部备案。【蕾蕾大招：外省内备30天】已取得营业性演出许可的演出剧（节）目通过互联网传播的，无需按照网络演出剧（节）目再进行报审或者报备。多家网络演出剧（节）目经营单位提供同一网络演出剧（节）目的，可以由一家牵头进行报审或者报备，也可以分别进行报审或者报备。进口网络演出剧（节）目包括参演人员中有境外演员，举办地、录制地在境外，或者虚拟演员、虚拟演出剧（节）目的版权属于外资机构、境外人员的网络演出剧（节）目。港澳台演员参照境外演员管理。含有港澳台资本的机构参照外资机构管理","matchCount":50,"sampleQuestions":[{"stem":"申请举办营业性组台演出，应提交的材料不包括（ ）。","options":[{"label":"A","text":"演出名称、演出举办单位和参加演出的文艺表演团体、演员"},{"label":"B","text":"演出时间、地点、场次"},{"label":"C","text":"3名以上专职演出经纪人员和与其业务相适应的资金"},{"label":"D","text":"文艺表演团体、演员同意参加演出的书面函件"}],"answer":"C","explain":"《营业性演出管理条例》第十六条规定，申请举办营业性演出， 提交的申请材料应当包括下列内容：（一）演出名称、演出举办单位和参加演出的文艺表演 团体、演员；（二）演出时间、地点、场次；（三）节目及其视听资料。申请举办营业性组 台演出，还应当提交文艺表演团体、演员同意参加演出的书面函件。提示：注意区分营业 性组台演出和营业性演出"},{"stem":"下列不属于营业性演出中以营利为目的的表现形式的是（ ）。","options":[{"label":"A","text":"演出主办方通过出售门票获取收入"},{"label":"B","text":"演出过程中接受了企业的赞助资金"},{"label":"C","text":"演出单位为了公益目的进行表演，不收取任何费用，也未接受赞助和广告"},{"label":"D","text":"以演出为契机，推广和销售与演出相关的周边产品"}],"answer":"C","explain":"《营业性演出管理条例实施细则》第二条规定，《条例》所称营业 性演出是指以营利为目的、通过下列方式为公众举办的现场文艺表演活动：（一）售票或者 接受赞助的；（二）支付演出单位或者个人报酬的；（三）以演出为媒介进行广告宣传或者 产品促销的；（四）以其他营利方式组织演出的。所以选C。"}]},{"k":"在线演出管理","v":"（1）以营利为目的，通过互联网为公众实时提供现场文艺表演活动的，应当按照《营业性演出管理条例》等有关规定办理报批手续，并由取得《网络文化经营许可证》的互联网文化单位提供在线传播服务。（2）演出举办单位应当在申报时一并提交在线传播服务单位许可证件、观演网址和应急预案等材料。【蕾蕾大招：线上忘记许可】（3）在线传播服务单位应当安排专人对演出内容、弹幕评论等进行实时审看，发现含有法规禁止内容立即采取删除、屏蔽、断开链接等必要措施并保留视频资料至少60日以上备查。（4）通过个人直播频道提供的网络表演，按照《网络表演经营活动管理办法》进行管理","matchCount":108,"sampleQuestions":[{"stem":"申请举办营业性组台演出，应提交的材料不包括（ ）。","options":[{"label":"A","text":"演出名称、演出举办单位和参加演出的文艺表演团体、演员"},{"label":"B","text":"演出时间、地点、场次"},{"label":"C","text":"3名以上专职演出经纪人员和与其业务相适应的资金"},{"label":"D","text":"文艺表演团体、演员同意参加演出的书面函件"}],"answer":"C","explain": 供的身份信息与其真实身份不一致的情况下，为其提供网络表演经纪服务D.网络表演经纪机构不得为未满十八周岁的未成年人提供网络表演经纪服务","options":[],"answer":"D","explain":""}]},{"k":"文艺工作者教育管理和道德建设","v":"加强学习教育：（一）深入学习习近平总书记关于文艺工作的系列重要论述精神。要提高政治站位，不断增强\"四个意识\"，坚定\"四个自信\"，做到\"两个维护\"，深刻认识文艺事业是党和人民的重要事业，文艺战线是党和人民的重要战线。要引导广大文艺工作者自觉以习近平新时代中国特色社会主义思想为指导，承担起举旗帜、聚民心、育新人、兴文化、展形象的使命任务，讲品位、讲格调、讲责任，不断提高思想品德修养、职业道德素养和人文艺术涵养，争做德艺双馨的文艺工作者。（二）学习法律法规，增强法律意识。（三）学习规章制度，筑牢思想防线。要组织学习相关部委关于治理天价片酬、\"阴阳合同\"、偷逃税等问题的文件精神，以及《演出行业演艺人员从业自律管理办法（试行）》等行业规范，教育引导广大文艺工作者不碰\"红线\"，不触\"底线\"，提升职业操守。加强示范引领：（1）创作推广把社会效益放在首位、社会效益和经济效益相统一的优秀文艺作品。（2）积极选树德艺双馨的优秀文艺工作者。要建立健全优秀文艺工作者的遴选推介机制，在选派参加重大活动以及选拔优秀人才等方面予以倾斜","matchCount":6,"sampleQuestions":[{"stem":"在《文化和旅游部办公厅关于进一步加强文艺工作者教育管理和道德建设的通知》中，加强学习教育包括（）。A.提升人格修为，增强社会责任感B.深入学习习近平总书记关于文艺工作的系列重要论述精神C.学习规章制度，筑牢思想防线D.学习法律法规，增强法律意识","options":[],"answer":"BCD","explain":""},{"stem":"规范演员从业行为，（）应当加强对演员的教育、提醒积极引导演员时刻敬畏法律红线，严守道德底线，提升职业操守，积极营造崇德尚艺、见贤思齐的良好风气。A.演员经纪从业人员B.经纪公司C.演员工作室D.各级文化和旅游行政部门","options":[],"answer":"A","explain":""}]},{"k":"明星广告代言管理","v":"依法诚信代言：明星不得为法律禁止生产、销售的产品（含禁止提供的服务）进行广告代言；不得为未使用过的商品（未接受过的服务）作推荐、证明；不得为无证经营的市场主体或者其他应取得审批资质但未经审批的企业进行广告代言；不得为烟草及烟草制品（含电子烟）、校外培训、医疗、药品、医疗器械、保健食品和特殊医学用途配方食品进行广告代言；不得违反其他法律法规对广告宣传的有关规定。规范企业选用明星开展广告活动：（1）确保广告内容真实→企业选用明星进行广告代言，应当向明星提供相关广告脚本并对广告内容的真实性、合法性负责。（2）妥善选用明星代言→严格遵守广告法律法规规定，不得选用因代言虚假广告被行政处罚未满三年的明星作为广告代言人。（3）严格遵守禁止性规定→企业不得选用不满十周岁的未成年人作为广告代言人。精准执法、严格监管：企业明知、应知明星发表过错误政治言论或者其他违背社会主义核心价值观言论造成恶劣社会影响，仍选用明星进行广告代言的，应当根据事实情节，认定相关广告妨碍社会安定、妨碍社会公共秩序。企业明知、应知明星存在吸毒、赌博、酒驾、强制猥亵、偷漏税、诈骗、证券内幕交易等违法犯罪行为造成恶劣社会影响，仍选用明星进行广告代言的，应当根据事实情节，认定相关广告违背社会良好风尚","matchCount":6,"sampleQuestions":[{"stem":"当企业明知、应知明星存在吸毒、赌博、酒驾等违法犯罪行为造成恶劣社会影响，仍选用明星进行广告代言的，应当根据事实情节，认定相关广告（）。A.妨碍社会安定B.妨碍社会公共秩序C.违背社会良好风尚D.违背公序良俗","options":[],"answer":"C","explain":""},{"stem":"根据相关法律法规，以下关于明星广告产品代言的哪种说法是正确的？（）A.明星可以代言任何产品B.明星不能代言药品，但可以代言保健食品C.明星不能代言未使用过的商品D.明星只要获得相关许可，就可以代言药品","options":[],"answer":"C","explain":""}]},{"k":"演出票务经纪","v":"从事营业性演出票务经营活动的单位，应向文化行政部门申请取得营业性演出许可证。演出票务经营单位经营营业性演出门票，应当取得演出举办单位授权。（1）演出票务经营单位预售或者销售演出门票前，应当核验演出举办单位的营业 var qProgress = {};  // {"subj|id":{marked:bool,correct:bool,time:num}}
var pProgress = {};  // {"subj|catIdx|itemIdx":true}

function L(k) { try{ return JSON.parse(localStorage.getItem(k))||{}; }catch(e){ return {}; } }
function S(k,v) { localStorage.setItem(k, JSON.stringify(v)); }
function persistUI() { var _u = L(STORAGE_KEY_U); _u.sf = statFilter; _u.qi = qIdx; _u.cs = currentSubj; _u.tab = currentTab; S(STORAGE_KEY_U, _u); }

function qKey(q) { return currentSubj+'|'+q.id; }
function pKey(s,ci,ii) { return s+'|'+ci+'|'+ii; }

// ========== 初始化 ==========
qProgress = L(STORAGE_KEY_Q);
pProgress = L(STORAGE_KEY_P);
var savedUI = L(STORAGE_KEY_U);
if (savedUI.sf) {
  statFilter = savedUI.sf;
  // 安全校验：恢复'wrong'但无错题时回退到'all'
  if (statFilter === 'wrong') {
    var hasAnyWrong = false;
    var keys = Object.keys(qProgress);
    for (var i = 0; i < keys.length; i++) {
      var p = qProgress[keys[i]];
      if (p && p.marked && !p.correct) { hasAnyWrong = true; break; }
    }
    if (!hasAnyWrong) statFilter = 'all';
  }
}
if (typeof savedUI.cs === 'number') {
  currentSubj = savedUI.cs;
  document.getElementById('subjSel').value = currentSubj;
}

// ========== Tab 切换 ==========
function switchTab(t, noSave) {
  currentTab = t;
  if (!noSave) persistUI();
  document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.toggle('active',b.dataset.tab===t); });
  document.querySelectorAll('.tab-panel').forEach(function(p){ p.classList.toggle('active',p.id==='tab-'+t); });
  if(t==='exam') refreshExam();
  if(t==='points') renderPoints();
  if(t==='dashboard') renderDashboard();
  if(t==='cram') renderCram();
}

// ========== 刷题逻辑 ==========
function onPtSubjChange() {
  var _u = L(STORAGE_KEY_U); _u.pts = parseInt(document.getElementById('ptSubjSel').value); S(STORAGE_KEY_U, _u);
  renderPoints();
}
function onCramSubjChange() {
  var _u = L(STORAGE_KEY_U); _u.crs = parseInt(document.getElementById('cramSubjSel').value); S(STORAGE_KEY_U, _u);
  renderCram();
}

function getQs() {
  var all = ALL_QUESTIONS[currentSubj].map(unpack);
  if(typeFilter!=='全部') all = all.filter(function(q){ return q.t===typeFilter; });
  return all;
}

function getFilteredQs() {
	  var qs = getQs();
	  if(statFilter==="all") return qs;
	  return qs.filter(function(q){
	    var k=qKey(q);
	    if(statFilter==="done") return !!qProgress[k];
	    if(statFilter==="correct") return qProgress[k]&&qProgress[k].correct;
	    if(statFilter==="wrong") return qProgress[k]&&qProgress[k].marked&&!qProgress[k].correct;
	    return true;
	  });
	}

function setStatFilter(f) {
  if(statFilter===f) return;
  statFilter = f;
  persistUI();
  refreshExam();
}

function onSubjChange() {
  currentSubj = parseInt(document.getElementById('subjSel').value);
  persistUI();
  refreshExam();
}

function onFilterChange() {
  typeFilter = document.getElementById('typeSel').value;
  refreshExam();
}

function toggleMode() {
	  if(statFilter==="wrong") {
	    setStatFilter("all");
	  } else {
	    var wrong=[];
	    getQs().forEach(function(q){ var k=qKey(q); if(qProgress[k]&&qProgress[k].marked&&!qProgress[k].correct) wrong.push(q); });
	    if(wrong.length===0) { alert("暂无错题！"); return; }
	    setStatFilter("wrong");
	  }
	  var btn = document.getElementById("modeBtn");
	  btn.textContent = statFilter==="wrong" ? "正常模式" : "错题模式";
	  btn.className = statFilter==="wrong" ? "btn btn-war" : "btn";
	}

function refreshExam() {
  filteredQs = getFilteredQs();
  qIdx = 0; userAns = null; answered = false;
  renderExam();
}

function renderExam() {
  renderStats();
  if(filteredQs.length===0) {
    var emptyMsg=statFilter==='wrong'?'没有错题':statFilter==='correct'?'没有做对的题':statFilter==='done'?'还没有刷过题':'没有题目';
	    var emptyHint=statFilter==='wrong'?'继续刷题，错题会出现在这里':statFilter==='correct'?'继续刷题，做对的题会出现在这里':statFilter==='done'?'开始刷题，做过的题会出现在这里':'请选择题型筛选';
	    document.getElementById('qArea').innerHTML = '<div class="empty-state"><h3>'+emptyMsg+'</h3><p>'+emptyHint+'</p></div>';
    document.getElementById('actBar').innerHTML = '';
    return;
  }
  renderQ();
  renderActs();
  updateProg();
}

function renderStats() {
  var total = getQs().length;
  var wrong=0;
  var done=0, correct=0;
  getQs().forEach(function(q){ var k=qKey(q); if(qProgress[k]){ done++; if(qProgress[k].correct) correct++; else if(qProgress[k].marked) wrong++; } });
  document.getElementById('statsBar').innerHTML =
    '<div class="stat'+(statFilter==='all'?' active':'')+'" onclick="setStatFilter(\'all\')"><span class="stat-val blue">'+total+'</span><span class="stat-label">题库</span></div>'+
    '<div class="stat'+(statFilter==='done'?' active':'')+'" onclick="setStatFilter(\'done\')"><span class="stat-val">'+done+'</span><span class="stat-label">已刷</span></div>'+
    '<div class="stat'+(statFilter==='correct'?' active':'')+'" onclick="setStatFilter(\'correct\')"><span class="stat-val green">'+correct+'</span><span class="stat-label">正确</span></div>'+
    '<div class="stat'+(statFilter==='wrong'?' active':'')+'" onclick="setStatFilter(\'wrong\')"><span class="stat-val red">'+wrong+'</span><span class="stat-label">错题</span></div>';
}

function updateProg() {
  var total = getQs().length;
  var done=0, correct=0;
  getQs().forEach(function(q){ var k=qKey(q); if(qProgress[k]){ done++; if(qProgress[k].correct) correct++; else if(qProgress[k].marked) wrong++; } });
  var pct = total>0?(done/total*100):0;
  document.getElementById('progFill').style.width = pct+'%';
  document.getElementById('progLabel').textContent = '已刷 '+done+' / '+total;
  document.getElementById('corrLabel').textContent = '正确 '+correct;
}

function esc(s) {
  if(!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderQ() {
  if(qIdx >= filteredQs.length) {
    document.getElementById('qArea').innerHTML = '<div class="empty-state"><h3>本轮已完成</h3><p>'+(statFilter?'错题已全部复习完毕！':'所有题目已刷完！')+'</p></div>';
    return;
  }
  var q = filteredQs[qIdx];
  var total = filteredQs.length;
  var typeMap = {'单选':'single','多选':'multi','判断':'judge'};
  var tc = typeMap[q.t]||'';

  var h = '<div class="card">'+
    '<div class="q-meta">'+
    '<span class="q-badge '+tc+'">'+q.t+'</span>'+
    '<span class="q-id">第'+(qIdx+1)+'/'+total+'题 · 原'+q.n+'号</span>'+
    (q.topic?'<span class="q-id">'+esc(q.topic)+'</span>':'')+
    '</div>'+
    '<div class="q-text">'+esc(q.q)+'</div>';

  if(q.t==='判断') {
    h += '<div class="judge-btns">'+
      '<div class="judge-btn judge-yes'+(userAns==='√'?' sel':'')+'" onclick="selJudge(\'√\')">✓ 正确</div>'+
      '<div class="judge-btn judge-no'+(userAns==='×'?' sel':'')+'" onclick="selJudge(\'×\')">✗ 错误</div>'+
      '</div>';
  } else if(q.o&&q.o.length>0) {
    h += '<div class="options">';
    q.o.forEach(function(opt,i) {
      var cls = '';
      if(answered) {
        if(q.a.indexOf(opt.label)>=0) cls=' show-ans';
        if(userAns&&userAns.indexOf(opt.label)>=0&&q.a.indexOf(opt.label)<0) cls=' wrong';
      } else if(userAns&&userAns.indexOf(opt.label)>=0) {
        cls=' sel';
      }
      h += '<div class="opt'+cls+'" onclick="selOpt(\''+opt.label+'\')">'+
        '<span class="opt-label">'+opt.label+'.</span>'+
        '<span class="opt-text">'+esc(opt.text)+'</span></div>';
	    });
    h += '</div>';
  }

  if(answered) {
    var isOk = checkAns(userAns, q.a);
    h += '<div class="ans-section show">'+
      '<div class="ans-label'+(isOk?' ok':' bad')+'">'+(isOk?'✓ 回答正确':'✗ 回答错误')+' · 正确答案: '+q.a+'</div>';
    if(userAns&&!isOk) h += '<div style="font-size:13px;color:var(--war);margin-top:2px;">你的答案: '+userAns+'</div>';
    if(q.e) h += '<div class="ans-explain">'+esc(q.e)+'</div>';
    h += '</div>';
  }

  h += '</div>';
  document.getElementById('qArea').innerHTML = h;
}

function selOpt(label) {
  if(answered) return;
  var q = filteredQs[qIdx]; if(!q) return;
  if(q.t==='多选') {
    if(!userAns) userAns='';
    if(userAns.indexOf(label)>=0) { userAns=userAns.replace(label,''); }
    else { userAns+=label; userAns=userAns.split('').sort().join(''); }
  } else { userAns=label; }
  renderQ();
}

function selJudge(val) { if(answered) return; userAns=val; renderQ(); }

function checkAns(u,c) {
  if(!u||!c) return false;
  return u.split('').sort().join('') === c.split('').sort().join('');
}

function renderActs() {
  var h = '';
  if(filteredQs.length===0||qIdx>=filteredQs.length) {
    h += '<button class="btn btn-pri" onclick="refreshExam()">重新开始</button>';
  } else {
    if(!answered) {
      h += '<button class="btn btn-pri" onclick="revealAns()">显示答案</button>';
      if(userAns) h += '<button class="btn" onclick="userAns=null;renderQ();">清除选择</button>';
    } else if(autoJudged) {
      h += '<button class="btn btn-pri" onclick="nextQ()">下一题</button>';
    } else {
      h += '<button class="btn btn-suc" onclick="markOk()">✓ 我做对了</button>';
      h += '<button class="btn btn-dan" onclick="markBad()">✗ 我做错了</button>';
    }
    h += '<button class="btn" onclick="skipQ()">跳过</button>';
  }
  document.getElementById('actBar').innerHTML = h;
}

function revealAns() {
  if(answered) return;
  answered = true;
  if(userAns) {
    markQ(checkAns(userAns, filteredQs[qIdx].a));
    autoJudged = true;
  }
  renderQ(); renderActs();
}

function markQ(isOk) {
  var q = filteredQs[qIdx]; if(!q) return;
  qProgress[qKey(q)] = {marked:true, correct:isOk, time:Date.now()};
  S(STORAGE_KEY_Q, qProgress);
}

function markOk() { markQ(true); nextQ(); }
function markBad() { markQ(false); nextQ(); }
function skipQ() { nextQ(); }

function nextQ() {
  qIdx++; userAns=null; answered=false; autoJudged=false;
  persistUI();
  if(qIdx>=filteredQs.length) { renderExam(); return; }
  renderExam(); window.scrollTo(0,0);
}

function resetProgress() {
  if(!confirm('确定要清除所有刷题进度和错题记录吗？此操作不可恢复。')) return;
  qProgress={}; S(STORAGE_KEY_Q,qProgress);
  statFilter='all'; qIdx=0; var _u = L(STORAGE_KEY_U); _u.sf='all'; _u.qi=0; S(STORAGE_KEY_U,_u);
  refreshExam();
}

// ========== 键盘快捷键 ==========
document.addEventListener('keydown',function(e) {
  if(e.target.tagName==='SELECT'||e.target.tagName==='INPUT') return;
  if(!filteredQs.length||qIdx>=filteredQs.length) return;
  var q=filteredQs[qIdx]; if(!q) return;
  if(!answered) {
    if(q.t==='判断') {
      if(e.key==='1') selJudge('√');
      if(e.key==='2') selJudge('×');
    } else if(q.o&&q.o.length>0) {
      var idx = e.key.charCodeAt(0)-65;
      if(idx>=0&&idx<q.o.length) selOpt(q.o[idx].label);
    }
    if(e.key===' '||e.key==='Enter') { e.preventDefault(); revealAns(); }
  } else if(autoJudged) {
    if(e.key===' '||e.key==='Enter') { e.preventDefault(); nextQ(); }
  } else {
    if(e.key==='1') markOk();
    if(e.key==='2') markBad();
    if(e.key===' '||e.key==='Enter') { e.preventDefault(); nextQ(); }
  }
});

// ========== 考点背诵逻辑 ==========
function getPoints() {
  var subj = parseInt(document.getElementById('ptSubjSel').value);
  var prio = document.getElementById('ptPrioSel').value;
  var cats = POINTS_DATA[subj].categories;
  if(prio!=='全部') cats = cats.filter(function(c){ return c.priority===parseInt(prio); });
  return {subject:POINTS_DATA[subj].subject, categories:cats};
}

function countPointProgress(data, subjIdx) {
  var total=0, done=0;
  data.categories.forEach(function(c,ci) {
    var origCi = POINTS_DATA[subjIdx].categories.indexOf(c);
    if(origCi<0) origCi=ci;
    c.items.forEach(function(it,ii) {
      total++;
      if(pProgress[pKey(subjIdx,origCi,ii)]) done++;
    });
  });
  return {total:total, done:done};
}

function renderPoints() {
  var subjIdx = parseInt(document.getElementById('ptSubjSel').value);
  var data = getPoints();
  var prog = countPointProgress(data, subjIdx);
  document.getElementById('ptStats').innerHTML = '已记 <b>'+prog.done+'</b>/<b>'+prog.total+'</b> ('+(prog.total>0?Math.round(prog.done/prog.total*100):0)+'%)';

  var h = '';
  data.categories.forEach(function(cat,ci) {
    var catDone=0, catTotal=cat.items.length;
    var origCi = POINTS_DATA[parseInt(document.getElementById('ptSubjSel').value)].categories.indexOf(cat);
    if(origCi<0) origCi=ci;
    cat.items.forEach(function(it,ii) {
      if(pProgress[pKey(subjIdx,origCi,ii)]) catDone++;
    });
    var pct = catTotal>0?Math.round(catDone/catTotal*100):0;

    h += '<div class="cat-section">'+
      '<div class="cat-header" data-ci="'+origCi+'" onclick="toggleCat(this)">'+
      '<span>'+esc(cat.name)+' <span class="cat-priority pri-'+cat.priority+'">'+(cat.priority===3?'必掌握':cat.priority===2?'高频':'一般')+'</span></span>'+
      '<span style="display:flex;align-items:center;gap:8px;"><span style="font-size:12px;color:var(--t2);">'+catDone+'/'+catTotal+'</span><span class="arrow">▶</span></span>'+
      '</div>'+
      '<div class="cat-body">';
    cat.items.forEach(function(it,ii) {
      var isDone = pProgress[pKey(subjIdx,origCi,ii)];
      h += '<div class="point-item">'+
        '<div class="point-cb'+(isDone?' done':'')+'" onclick="togglePoint('+origCi+','+ii+')">'+(isDone?'✓':'')+'</div>'+
        '<div class="point-content">'+
        '<div class="point-title">'+esc(it.k)+'</div>'+
        '<div class="point-desc">'+esc(it.v)+'</div>'+
        '</div></div>';
	    });
    h += '</div></div>';
	  });

  if(data.categories.length===0) h = '<div class="empty-state"><h3>没有匹配的考点</h3></div>';
  var openCats = {};
  document.querySelectorAll('#pointsArea .cat-header.open').forEach(function(hdr) {
    if(hdr.dataset.ci) openCats[hdr.dataset.ci] = true;
  });
    document.getElementById('pointsArea').innerHTML = h;
  document.querySelectorAll('#pointsArea .cat-header').forEach(function(hdr) {
    if(openCats[hdr.dataset.ci]) {
      hdr.classList.add('open');
      hdr.nextElementSibling.classList.add('open');
    }
  });
}

function toggleCat(el) {
  el.classList.toggle('open');
  el.nextElementSibling.classList.toggle('open');
}

function togglePoint(ci,ii) {
  var subj = parseInt(document.getElementById('ptSubjSel').value);
  var key = pKey(subj,ci,ii);
  if(pProgress[key]) { delete pProgress[key]; }
  else { pProgress[key]=true; }
  S(STORAGE_KEY_P, pProgress);
  renderPoints();
}

// ========== 进度总览 ==========
function renderDashboard() {
  // 刷题统计
  var examHtml = '';
  var subjNames = ['思想政治与法律基础','演出市场政策与经纪实务'];
  var totalQDone=0, totalQCorrect=0, totalQAll=0;
  for(var s=0;s<2;s++) {
    var all = ALL_QUESTIONS[s].map(unpack);
    var done=0, correct=0;
    all.forEach(function(q){ var k=s+'|'+q.id; if(qProgress[k]){ done++; if(qProgress[k].correct) correct++; } });
    totalQDone+=done; totalQCorrect+=correct; totalQAll+=all.length;
    var pct = all.length>0?Math.round(done/all.length*100):0;
    var rate = done>0?Math.round(correct/done*100):0;
    examHtml += '<div class="db-item">'+
      '<div class="lbl">'+subjNames[s]+'</div>'+
      '<div class="num blue">'+done+'<span style="font-size:14px;font-weight:400">/'+all.length+'</span></div>'+
      '<div class="lbl">正确率 '+rate+'%</div>'+
      '<div class="db-bar-wrap"><div class="db-bar"><div class="db-bar-fill" style="width:'+pct+'%;background:var(--pri);"></div></div></div>'+
      '</div>';
  }
  document.getElementById('dbExamStats').innerHTML = examHtml;

  // 考点统计
  var ptHtml = '';
  var ptAllTotal=0, ptAllDone=0;
  for(var s=0;s<2;s++) {
    var cp = countPointProgress({subject:s,categories:POINTS_DATA[s].categories}, s);
    ptAllTotal+=cp.total; ptAllDone+=cp.done;
    var pct = cp.total>0?Math.round(cp.done/cp.total*100):0;
    ptHtml += '<div class="db-item">'+
      '<div class="lbl">'+subjNames[s]+'</div>'+
      '<div class="num blue">'+cp.done+'<span style="font-size:14px;font-weight:400">/'+cp.total+'</span></div>'+
      '<div class="lbl">考点记忆率 '+pct+'%</div>'+
      '<div class="db-bar-wrap"><div class="db-bar"><div class="db-bar-fill" style="width:'+pct+'%;background:var(--suc);"></div></div></div>'+
      '</div>';
  }
  document.getElementById('dbPointStats').innerHTML = ptHtml;

  // 准备度评估
  var examCov = totalQAll>0?Math.round(totalQDone/totalQAll*100):0;
  var examAcc = totalQDone>0?Math.round(totalQCorrect/totalQDone*100):0;
  var ptCov = ptAllTotal>0?Math.round(ptAllDone/ptAllTotal*100):0;
  var readiness = Math.round(examCov*0.5 + examAcc*0.3 + ptCov*0.2);

  var color = readiness>=80?'var(--suc)':readiness>=50?'var(--war)':'var(--dan)';
  var level = readiness>=80?'准备充分，可以应考':readiness>=50?'还需加强，继续努力':'时间紧迫，重点突击';

  document.getElementById('dbReadiness').innerHTML =
    '<div class="db-item" style="width:100%;">'+
    '<div class="num" style="color:'+color+';">'+readiness+'%</div>'+
    '<div class="lbl">综合准备度 ('+level+')</div>'+
    '<div class="lbl" style="margin-top:4px;">刷题覆盖率 '+examCov+'% × 0.5 + 正确率 '+examAcc+'% × 0.3 + 考点记忆 '+ptCov+'% × 0.2</div>'+
    '<div class="db-bar-wrap"><div class="db-bar"><div class="db-bar-fill" style="width:'+readiness+'%;background:'+color+';"></div></div></div>'+
    '</div>';
}

// ========== 最后一夜冲刺 ==========
function renderCram() {
  var subjIdx = parseInt(document.getElementById('cramSubjSel').value);
  var cats = OVERLAP_DATA[subjIdx].categories;
  var totalItems = 0; var totalMatches = 0;
  cats.forEach(function(c){ c.items.forEach(function(it){ totalItems++; totalMatches+=it.matchCount; }); });
  document.getElementById('cramStats').innerHTML = '重叠考点 <b>'+totalItems+'</b> 条 / 关联 <b>'+totalMatches+'</b> 题';

  var h = '';
  cats.forEach(function(cat, ci) {
    h += '<div class="cat-section">'+
      '<div class="cat-header" onclick="toggleCat(this)">'+
      '<span>'+esc(cat.name)+' <span class="cat-priority pri-'+cat.priority+'">'+(cat.priority===3?'必掌握':cat.priority===2?'高频':'一般')+'</span></span>'+
      '<span style="display:flex;align-items:center;gap:8px;"><span style="font-size:12px;color:var(--t2);">'+cat.items.length+'条</span><span class="arrow">▶</span></span>'+
      '</div>'+
      '<div class="cat-body">';
    cat.items.forEach(function(it, ii) {
      h += '<div class="point-item cram-item">'+
        '<div class="point-content" style="width:100%;">'+
        '<div class="point-title">'+esc(it.k)+' <span class="cram-badge">'+it.matchCount+'题</span></div>'+
        '<div class="point-desc">'+esc(it.v)+'</div>';
      if (it.sampleQuestions && it.sampleQuestions.length > 0) {
        h += '<span class="cram-toggle" onclick="var p=this.parentElement.querySelector(\'.cram-qs\');p.classList.toggle(\'open\');this.textContent=p.classList.contains(\'open\')?\'▲ 收起题目\':\'▼ 查看真题 ('+it.sampleQuestions.length+'道)\';"></span>';
        h += '<div class="cram-qs">';
        it.sampleQuestions.forEach(function(sq) {
          var optsHtml = '';
          if (sq.options && sq.options.length > 0) {
            optsHtml = '<div style="margin-top:6px;">'+sq.options.map(function(o){
              var isRight = (sq.answer||'').indexOf(o.label)>=0;
              return '<span class="cram-opt'+(isRight?' cram-opt-right':'')+'">'+esc(o.label)+'. '+esc(o.text)+(isRight?' ✓':'')+'</span>';
            }).join('')+'</div>';
          }
          h += '<div class="cram-q-item">'+
            '<div class="cram-q-stem">'+esc(sq.stem)+'</div>'+
            optsHtml+
            '<div class="cram-q-answer">正确答案：<b>'+esc(sq.answer)+'</b></div>'+
            (sq.explain ? '<div class="cram-q-explain">'+esc(sq.explain)+'</div>' : '')+
            '</div>';
        });
        h += '</div>';
      }
      h += '</div></div>';
    });
    h += '</div></div>';
  });

  if (cats.length===0) h = '<div class="empty-state"><h3>没有匹配的重叠考点</h3><p>请确认已运行重叠检测脚本</p></div>';

  // 恢复展开状态
  var openCats = {};
  document.querySelectorAll('#cramArea .cat-header.open').forEach(function(hdr) {
    if(hdr.textContent) openCats[hdr.textContent.split(' ')[0]] = true;
  });
  document.getElementById('cramArea').innerHTML = h;
  // 初始化 toggle 文字
  document.querySelectorAll('#cramArea .cram-toggle').forEach(function(el) {
    el.textContent = '▼ 查看真题 ('+el.parentElement.querySelector('.cram-qs').querySelectorAll('.cram-q-item').length+'道)';
  });
}

function exportCram() {
  var subj = parseInt(document.getElementById('cramSubjSel').value);
  var data = OVERLAP_DATA[subj];
  var lines = ['# '+data.subject+' — 最后一夜冲刺重点','','> 导出时间: '+new Date().toLocaleString(),'','---',''];
  data.categories.forEach(function(cat) {
    lines.push('## '+cat.name+' ('+(cat.priority===3?'必掌握':cat.priority===2?'高频':'一般')+')','');
    cat.items.forEach(function(it, ii) {
      lines.push('### '+(ii+1)+'. '+it.k+' 【关联'+it.matchCount+'题】','');
      lines.push(it.v,'');
      if (it.sampleQuestions && it.sampleQuestions.length > 0) {
        it.sampleQuestions.forEach(function(sq, qi) {
          lines.push('> 真题'+(qi+1)+': '+sq.stem.replace(/\n/g,' '));
          if (sq.options && sq.options.length > 0) {
            sq.options.forEach(function(o) {
              var isRight = (sq.answer||'').indexOf(o.label)>=0;
              lines.push('>   '+o.label+'. '+o.text+(isRight?' ✅':''));
            });
          }
          lines.push('> 正确答案: **'+sq.answer+'**',(sq.explain?'> 解析: '+sq.explain:'')+'','');
        });
      }
      lines.push('---','');
    });
  });
  downloadFile(data.subject+'_冲刺重点.md', lines.join('\n'));
}

// ========== 导出功能 ==========
function exportChecklist() {
  var subj = parseInt(document.getElementById('ptSubjSel').value);
  var data = getPoints();
  var lines = ['# '+data.subject+' — 考点背诵清单','','> 导出时间: '+new Date().toLocaleString(),'','| 状态 | 分类 | 考点 | 内容 |','|------|------|------|------|'];
  data.categories.forEach(function(cat,ci) {
    var origCi = POINTS_DATA[subj].categories.indexOf(cat);
    if(origCi<0) origCi=ci;
    cat.items.forEach(function(it,ii) {
      var done = pProgress[pKey(subj,origCi,ii)] ? '✓ 已记' : '✗ 未记';
      var prio = cat.priority===3?'必掌握':cat.priority===2?'高频':'一般';
      lines.push('| '+done+' | '+prio+' | '+it.k+' | '+it.v+' |');
    });
  });
  downloadFile(data.subject+'_考点背诵清单.md', lines.join('\n'));
}

function exportAllProgress() {
  var lines = ['# 演出经纪人考前进度报告','','> 导出时间: '+new Date().toLocaleString(),''];
  var subjNames = ['思想政治与法律基础','演出市场政策与经纪实务'];

  lines.push('## 一、刷题进度','');
  for(var s=0;s<2;s++) {
    var all = ALL_QUESTIONS[s].map(unpack);
    var done=0, correct=0, wrong=0;
    all.forEach(function(q){ var k=s+'|'+q.id; if(qProgress[k]){ done++; if(qProgress[k].correct) correct++; else wrong++; } });
    lines.push('### '+subjNames[s]+' ('+all.length+'题)');
    lines.push('- 已刷: '+done+'/'+all.length+' ('+Math.round(done/all.length*100)+'%)');
    lines.push('- 正确: '+correct+' 题');
    lines.push('- 错题: '+wrong+' 题');
    lines.push('- 正确率: '+(done>0?Math.round(correct/done*100):0)+'%');
    lines.push('');
  }

  lines.push('## 二、考点背诵进度','');
  for(var s=0;s<2;s++) {
    var cp = countPointProgress({subject:s,categories:POINTS_DATA[s].categories}, s);
    lines.push('### '+subjNames[s]);
    lines.push('- 已记住: '+cp.done+'/'+cp.total+' ('+Math.round(cp.done/cp.total*100)+'%)');
    POINTS_DATA[s].categories.forEach(function(cat,ci) {
      var cd=0;
      cat.items.forEach(function(it,ii){ if(pProgress[pKey(s,ci,ii)]) cd++; });
      lines.push('  - '+cat.name+': '+cd+'/'+cat.items.length);
    });
    lines.push('');
	  }

  downloadFile('演出经纪人_进度报告_'+new Date().toISOString().slice(0,10)+'.md', lines.join('\n'));
}

function downloadFile(fn, content) {
  var blob = new Blob(['\ufeff'+content], {type:'text/markdown;charset=utf-8'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = fn;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

// ========== 启动 ==========
if (typeof savedUI.pts === 'number') {
  document.getElementById('ptSubjSel').value = savedUI.pts;
}
if (typeof savedUI.crs === 'number') {
  document.getElementById('cramSubjSel').value = savedUI.crs;
}
var _restoreTab = savedUI.tab || 'exam';
switchTab(_restoreTab, true);
if (_restoreTab === 'exam' && typeof savedUI.qi === 'number' && savedUI.qi >= 0 && savedUI.qi < filteredQs.length) {
  qIdx = savedUI.qi;
  while (qIdx < filteredQs.length) {
    if (!qProgress[qKey(filteredQs[qIdx])]) break;
    qIdx++;
  }
  userAns = null; answered = false;
  renderExam();
}
